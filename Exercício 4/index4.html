<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style4.css">
    <link rel="icon" href="mídia/iconHospital.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <title>Formulário - Exercício 4</title>
</head>
<body>
    <main>

        <h1> Clinica Saúde&Bem-Estar</h1>
    
        <div class="posicionamento">
            <h2> Dados do Paciente </h2>

            <div class="campoBloco">
                <div class="campoLinha">
                <label for="nome">Nome completo:</label>
                </div>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
            </div>

            <div class="campoBloco">
                <label for="email"> E-mail: </label>
                <input type="email" id="email" name="email" placeholder="......@gmail.com">
            </div>

            <div class="campoBloco">
                <label for="telefone">Telefone:</label>
                <input type="number" id="telefone" name="telefone"  placeholder="(14) 99999-0000">
            </div>

            <div class="campoBloco">
                <label for="nascimento">Data de nascimento: </label>
                <input type="date" id="nascimeno" name="nascimento">
            </div>

            <h2> Agendamento de Consulta</h2>

            <div class="campoBloco">
                <label for="especialidade"> Especialidade: </label>
                <select id="especialidade" name="especialidade">
                     <option value="" disabled selected>Selecione uma especialidade...</option>
                        <option value="cardiologia">Cardiologia</option>
                        <option value="cirurgia_geral">Cirurgia Geral</option>
                        <option value="clinica_medica">Clínica Médica</option>
                        <option value="dermatologia">Dermatologia</option>
                        <option value="endocrinologia">Endocrinologia</option>
                        <option value="gastroenterologia">Gastroenterologia</option>
                        <option value="geriatria">Geriatria</option>
                        <option value="ginecologia_e_obstetricia">Ginecologia e Obstetrícia</option>
                        <option value="medicina_de_familia">Medicina de Família e Comunidade</option>
                        <option value="neurologia">Neurologia</option>
                        <option value="oftalmologia">Oftalmologia</option>
                        <option value="ortopedia_e_traumatologia">Ortopedia e Traumatologia</option>
                        <option value="otorrinolaringologia">Otorrinolaringologia</option>
                        <option value="pediatria">Pediatria</option>
                        <option value="pneumologia">Pneumologia</option>
                        <option value="psiquiatria">Psiquiatria</option>
                        <option value="reumatologia">Reumatologia</option>
                        <option value="urologia">Urologia</option>
                        <option value="outra">Outra especialidade</option>
                </select>
            </div>

            <div class="campoBloco">
                <label for="dataConsulta">Data da consulta:</label>
                <input type="date" id="dataConsulta" name="dataConsulta">
            </div>

            <div class="campoBloco">
                <label for="horario">Horário:</label>
                <input type="time" id="horario" name="horario">
            </div>

            <h2> Resultados de Exames </h2>

            <div class="campoBloco">
                <label for="exameAnexo"> Enviar arquivo do exame: </label>
                <input type="file" id="exameAnexo" name="exameAnexo">
            </div>

            <div class="campoBloco">
                <label for="temperatura">Qual a sua temperatura corporal?</label>

                <div class="rangeLinha">
                    <span>28 °C</span>
                    <input type="range" id="temperatura" name="temperatura" min="28" max="43">
                    <span>43 °C</span>
                </div>
            </div>

            <div class="campoBloco">
                <input type="submit" id="envio" name="envio" value="Enviar Cadastro">
            </div>
        </div>


    </main>
</body>
</html>
