<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet"  href="style3.css">
       <link rel="icon" href="mídia/logoSenai.png">
        <title>Formulário - Exercício 3</title>
</head>
<body>

    <div class="conteiner">
        <main>
                <div class="logoTopo">
                    <div class="faixaBranca">
                        <img src="mídia/logoSesi.png" alt="logo SESI">
                        <img  id="senai" src="mídia/logoSenai.png" alt="logo SENAI">
                    </div>
                </div>


                <form class="posicionamento">
                    
                    <p> SESI-SENAI </p>

                    <div class="campoBloco">
                        <label for="user"> Digite seu nome de usuário</label>
                        <input type="text" id="user" name="name">
                    </div>

                    <div class="campoBloco">
                        <label for="senha">Digite sua senha</label>
                        <input type="password" id="senha" name="senha">
                    </div>

                    <label for="envio"></label>
                    <input type="submit" id="envio" name="enviar">

                    <button>Esqueci minha senha</button>
                </form>

        </main>
    </div>
</body>
</html>
