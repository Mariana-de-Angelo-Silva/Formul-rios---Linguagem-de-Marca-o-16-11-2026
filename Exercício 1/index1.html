<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"  href="style1.css" >

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<link rel="icon" href="mídia/logo.png">

        <title>Formulário - Exercício 1</title>
</head>
<body>
    <header>
        <img src="mídia/logo.png" alt="logo superior">
    </header>
    
        <main>
                <section>
                            <form class="posicionamento">
                                
                                <div class="pequenoCampo">
                                        <label for="nome"> Informe seu nome completo</label>
                                        <input type="text" id="nome" name="nome"  placeholder="Digite seu nome completo">
                                </div>

                                <div class="campoLinha">
                                        <input type="checkbox" id="marcacao-termos" name="marcacao-termos" placeholder="Li e concordo com os termos.">
                                        <label for="marcacao-termos">Li e concordo com os termos de uso</label>
                                </div>


                                <div class="pequenoCampo"> <label for="sexo"> Informe seu sexo</label> 
                                        <div id="opcaoSexo">
                                                <input type="radio" id="sexo-feme" name="feminino" value="Feminino" placeholder="Feminino">
                                                <label for="sexo-feme">Feminino</label>
                                        </div>

                                        <div id="sexo">
                                                <input type="radio" id="sexo-male" name="masculino" value="Masculino" placeholder="Masculino">
                                                <label for="sexo-male">Masculino</label>
                                        </div>
                                </div>

                                <div class="pequenoCampo">
                                        <label for="email">Informe seu email</label>
                                        <input type="email" id="email" name="email" placeholder="..........@gmail.com">
                                </div>
                                

                                <div class="pequenoCampo">
                                        <label for="nascimento"> Informe sua data de nascimento</label>
                                        <input type="date" id="nascimento" name="nascimento" placeholder="dd/mm/aaaa">
                                </div>
                                

                                <div class="pequenoCampo">
                                        <label for="RG"> Informe seu RG</label>
                                        <input type="text" id="RG" name="RG" placeholder="12.345.678-9">
                                </div>

                                
                                <div class="pequenoCampo">
                                        <label for="feedback"> Qual a prontidão necessária para o atendimento? </label>
                                        <input type="range" id="feedback" name="pesquisaSatisfação">
                                </div>


                                <div class="pequenoCampo">
                                        <label for="servicos"> Escolha o serviço desejado.</label>

                                        <select id="servicos" name="atendimentos">
                                            <option value="" disabled selected>Selecione uma especialidade...</option>
                                            <option>Matrícula</option>
                                            <option>Reagendamento</option>
                                            <option>Cancelamento de matrícula</option>
                                        </select>   
                                        
                                </div>


                                <div class="pequenoCampo">
                                        <label for="envio"> Enviar formulário</label>
                                        <input type="submit" id="envio" name="envio">
                                </div>
                    
                            </form>
                </section>

                <aside>
                    
                </aside>
        </main>
        
        <footer>
            <p> Agradecemos acesso! Venha viver uma vida mais leve com Zen ~</p>
        </footer>
</body>
</html>
